[project]
name = "cof"
version = "0.1.0"
description = "Acquire, normalize and parse the Previews World Customer Order Form (COF) archive"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "tenacity>=9.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "types-PyYAML",
    "ruff>=0.8",
]

[project.scripts]
cof-acquire = "cof.acquire.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["adhoc"]
markers = ["network: tests that need internet access (deselected by default)"]
addopts = "-m 'not network'"

[tool.mypy]
strict = true
files = ["src", "adhoc", "tests"]
mypy_path = "src:adhoc"
explicit_package_bases = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "adhoc", "tests"]
# tools/ holds legacy scripts that are intentionally left as they are
extend-exclude = ["tools"]

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes, I: imports, B: bugbear, UP: modern syntax,
# ANN: type annotations required, D: docstrings (Google style)
select = ["E", "F", "W", "I", "B", "UP", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
